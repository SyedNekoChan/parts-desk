name: Deploy to GitHub Pages

on:
  push:
    branches: [backend]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded site is never what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json is now committed, so installs are reproducible
      # and `npm ci` (fails fast on a lockfile/package.json mismatch,
      # rather than silently re-resolving) is the right tool here.
      - run: npm ci

      - run: npm test

      - name: Build
        # The repository name becomes the URL prefix on a project site.
        # Reading it from the workflow context means a fork or a rename
        # keeps working without anyone editing vite.config.js.
        run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
