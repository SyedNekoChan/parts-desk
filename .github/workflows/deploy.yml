name: Deploy to GitHub Pages

on:
  push:
    branches: [backend]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The `|| npm install` fallback let a broken or empty lockfile
      # silently degrade into an unreproducible install instead of
      # failing the build — masking exactly the kind of lockfile
      # problem that needs to be caught, not worked around.
      - run: npm ci

      - run: npm test

      - name: Build
        run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
